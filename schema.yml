components:
  schemas:
    AskAgent:
      type: object
      properties:
        question:
          type: string
          maxLength: 500
        specialist:
          type: string
          maxLength: 100
        conversation_id:
          type: integer
          minimum: 1
        companion_mode:
          type: boolean
          default: false
      required:
      - question
    CustomTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    FinancialMetric:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        month:
          type: string
          maxLength: 50
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        ebitda:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        cash_position:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        organization:
          type: integer
          readOnly: true
          nullable: true
      required:
      - cash_position
      - created_at
      - ebitda
      - expenses
      - id
      - month
      - organization
      - revenue
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
